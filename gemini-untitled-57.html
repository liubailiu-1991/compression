<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win解压缩 9.0 - Modern UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans SC"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            400: '#3B82F6',
                            500: '#2563EB',
                            600: '#1D4ED8',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Protocol 1: 全局工程环境 - 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* 避免文本被选中，模拟原生 App 质感 */
        body {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden antialiased selection:bg-blue-100">

    <header class="relative h-24 bg-gradient-to-r from-[#2B7AFA] to-[#4FA0FF] text-white flex-shrink-0 shadow-sm z-50 overflow-hidden">
        
        <div class="absolute -bottom-6 right-16 text-[8rem] font-black italic opacity-20 pointer-events-none select-none font-sans leading-none tracking-tighter mix-blend-overlay">
            9.0
        </div>

        <div class="w-full h-full flex items-center justify-between pl-6 pr-0 relative z-10">
            
            <div class="flex items-center gap-x-4">
                <div class="w-10 h-10 bg-gradient-to-b from-blue-400 to-blue-700 rounded-lg shadow-inner border border-white/20 flex items-center justify-center relative">
                    <div class="absolute w-1 h-6 bg-yellow-400 rounded-full shadow-sm z-20"></div>
                    <div class="w-8 h-2 bg-white/20 absolute top-2 rounded-sm"></div>
                    <div class="w-8 h-2 bg-white/20 absolute bottom-2 rounded-sm"></div>
                </div>
                
                <div>
                    <h1 class="text-2xl font-bold tracking-wide">Win解压缩</h1>
                    <p class="text-xs text-blue-100 font-medium opacity-90 tracking-wider">轻巧快速 · 专业好用无广告</p>
                </div>
            </div>

            <div class="flex items-start h-full pt-0">
                
                <div class="flex items-center gap-x-3 mr-4 h-full pt-6">
                    <button class="flex items-center gap-x-2 bg-black/10 hover:bg-black/20 transition-colors px-3 py-1.5 rounded-full text-sm font-medium border border-white/10">
                        <div class="w-5 h-5 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center">
                            <i data-lucide="user" class="w-3 h-3"></i>
                        </div>
                        <span>未登录</span>
                    </button>
                    
                    <button class="flex items-center gap-x-1 bg-yellow-400 text-yellow-900 hover:bg-yellow-300 transition-colors px-3 py-1.5 rounded-full text-sm font-bold shadow-sm">
                        <i data-lucide="crown" class="w-3 h-3 fill-current"></i>
                        <span>成为会员</span>
                    </button>

                    <button class="p-2 hover:bg-white/10 rounded-lg transition-colors text-xs border border-white/20 px-3">客服</button>
                    <button class="p-2 hover:bg-white/10 rounded-lg transition-colors"><i data-lucide="menu" class="w-5 h-5"></i></button>
                </div>

                <div class="flex h-full items-start">
                    <button class="w-12 h-8 flex items-center justify-center hover:bg-white/10 transition-colors text-white">
                        <i data-lucide="minus" class="w-4 h-4"></i>
                    </button>
                    <button class="w-12 h-8 flex items-center justify-center hover:bg-white/10 transition-colors text-white">
                        <i data-lucide="square" class="w-3.5 h-3.5"></i>
                    </button>
                    <button class="w-12 h-8 flex items-center justify-center hover:bg-red-500 hover:text-white transition-colors text-white group">
                        <i data-lucide="x" class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-8 bg-white w-full">
        <div class="max-w-[1600px] mx-auto grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-6 pb-8">

            <div class="group relative flex flex-col items-center p-8 rounded-3xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-blue-50 border border-blue-100/50">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-400 to-blue-600 shadow-blue-200 shadow-lg flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="archive" class="text-white w-8 h-8 stroke-[2.5]"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">添加压缩包</h3>
                <p class="text-sm text-gray-500 text-center mb-8 h-10 leading-snug">高速智能压缩，支持Zip、7z、TAR等多种格式</p>
                <button class="bg-white text-blue-600 border border-blue-100 font-bold py-2.5 px-10 rounded-full shadow-sm hover:shadow-md hover:bg-blue-50 transition-all active:scale-95">
                    立即压缩
                </button>
            </div>

            <div class="group relative flex flex-col items-center p-8 rounded-3xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-orange-50 border border-orange-100/50">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-orange-400 to-orange-600 shadow-orange-200 shadow-lg flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="image" class="text-white w-8 h-8 stroke-[2.5]"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">图片压缩</h3>
                <p class="text-sm text-gray-500 text-center mb-8 h-10 leading-snug">多种方式自由压缩<br>多格式支持</p>
                <button class="bg-white text-orange-600 border border-orange-100 font-bold py-2.5 px-10 rounded-full shadow-sm hover:shadow-md hover:bg-orange-50 transition-all active:scale-95">
                    立即压缩
                </button>
            </div>

            <div class="group relative flex flex-col items-center p-8 rounded-3xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-red-50 border border-red-100/50">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-red-400 to-red-600 shadow-red-200 shadow-lg flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="file-text" class="text-white w-8 h-8 stroke-[2.5]"></i>
                    <span class="absolute text-[0.6rem] font-bold text-red-500 bg-white px-1 rounded-sm top-4 right-3.5 shadow-sm">PDF</span>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">PDF压缩</h3>
                <p class="text-sm text-gray-500 text-center mb-8 h-10 leading-snug">一键批量压缩，保证PDF文件质量的同时最大化压缩体积</p>
                <button class="bg-white text-red-600 border border-red-100 font-bold py-2.5 px-10 rounded-full shadow-sm hover:shadow-md hover:bg-red-50 transition-all active:scale-95">
                    立即使用
                </button>
            </div>

            <div class="group relative flex flex-col items-center p-8 rounded-3xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-cyan-50 border border-cyan-100/50">
                <div class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-bl-xl rounded-tr-xl shadow-md z-10">
                    报考专用
                </div>
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan-400 to-cyan-600 shadow-cyan-200 shadow-lg flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="user-square-2" class="text-white w-8 h-8 stroke-[2.5]"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">证件照压缩</h3>
                <p class="text-sm text-gray-500 text-center mb-8 h-10 leading-snug">一键智能生成报考审核照片</p>
                <button class="bg-white text-cyan-600 border border-cyan-100 font-bold py-2.5 px-10 rounded-full shadow-sm hover:shadow-md hover:bg-cyan-50 transition-all active:scale-95">
                    立即使用
                </button>
            </div>

            <div class="group relative flex flex-col items-center p-8 rounded-3xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-sky-50 border border-sky-100/50">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-400 to-sky-600 shadow-sky-200 shadow-lg flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="upload" class="text-white w-8 h-8 stroke-[2.5]"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">压缩包解压</h3>
                <p class="text-sm text-gray-500 text-center mb-8 h-10 leading-snug">一键智能高速解压<br>64种格式支持</p>
                <button class="bg-white text-sky-600 border border-sky-100 font-bold py-2.5 px-10 rounded-full shadow-sm hover:shadow-md hover:bg-sky-50 transition-all active:scale-95">
                    一键解压
                </button>
            </div>

            <div class="group relative flex flex-col items-center p-8 rounded-3xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-indigo-50 border border-indigo-100/50">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-400 to-indigo-600 shadow-indigo-200 shadow-lg flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="film" class="text-white w-8 h-8 stroke-[2.5]"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">视频压缩</h3>
                <p class="text-sm text-gray-500 text-center mb-8 h-10 leading-snug">高质量无损批量压缩，多种视频格式支持，省时又高效</p>
                <button class="bg-white text-indigo-600 border border-indigo-100 font-bold py-2.5 px-10 rounded-full shadow-sm hover:shadow-md hover:bg-indigo-50 transition-all active:scale-95">
                    立即使用
                </button>
            </div>

            <div class="group relative flex flex-col items-center p-8 rounded-3xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-emerald-50 border border-emerald-100/50">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 shadow-emerald-200 shadow-lg flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="file-text" class="text-white w-8 h-8 stroke-[2.5]"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">文档压缩</h3>
                <p class="text-sm text-gray-500 text-center mb-8 h-10 leading-snug">高质量压缩Word/PPT/Excel等文档文件</p>
                <button class="bg-white text-emerald-600 border border-emerald-100 font-bold py-2.5 px-10 rounded-full shadow-sm hover:shadow-md hover:bg-emerald-50 transition-all active:scale-95">
                    立即压缩
                </button>
            </div>

            <div class="group relative flex flex-col items-center p-8 rounded-3xl transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-amber-50 border border-amber-100/50">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 shadow-amber-200 shadow-lg flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="folder-open" class="text-white w-8 h-8 stroke-[2.5]"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">文件管理</h3>
                <p class="text-sm text-gray-500 text-center mb-8 h-10 leading-snug">高效管理和预览文件<br>压缩解压更方便</p>
                <button class="bg-white text-amber-600 border border-amber-100 font-bold py-2.5 px-10 rounded-full shadow-sm hover:shadow-md hover:bg-amber-50 transition-all active:scale-95">
                    开始管理
                </button>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
