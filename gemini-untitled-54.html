<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win解压缩 9.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            400: '#60a5fa', // Light Blue match
                            500: '#3b82f6', // Standard Blue match
                            600: '#2563eb', // Deep Blue
                        }
                    },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'card-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>

    <style>
        /* 全局滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* 禁止文本选择，模拟 App 质感 */
        body {
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-[#f8fafc] flex flex-col min-w-[1024px] min-h-[600px]">

    <header class="relative h-[180px] shrink-0 bg-gradient-to-r from-[#2c7bf6] to-[#60a5fa] text-white p-6 overflow-hidden">
        
        <div class="absolute top-0 right-0 flex items-start z-50">
            <div class="flex items-center h-8 mr-4 gap-3 text-sm font-medium">
                <div class="flex items-center gap-1 opacity-90 hover:opacity-100 cursor-pointer transition-opacity">
                    <div class="w-5 h-5 bg-white/20 rounded-full flex items-center justify-center">
                        <i data-lucide="user" class="w-3 h-3 text-white"></i>
                    </div>
                    <span>未登录</span>
                </div>
                <div class="flex items-center gap-1 bg-[#fbbf24] hover:bg-[#f59e0b] text-yellow-900 px-2 py-0.5 rounded-full cursor-pointer transition-colors shadow-sm">
                    <i data-lucide="crown" class="w-3 h-3"></i>
                    <span class="text-xs font-bold">成为会员</span>
                </div>
                <button class="hover:bg-white/10 rounded px-2 py-1 transition-colors text-xs border border-white/30">客服</button>
                <button class="hover:bg-white/10 p-1 rounded transition-colors"><i data-lucide="menu" class="w-4 h-4"></i></button>
            </div>

            <div class="flex">
                <button class="w-12 h-8 flex items-center justify-center hover:bg-white/10 transition-colors">
                    <i data-lucide="minus" class="w-4 h-4 text-white"></i>
                </button>
                <button class="w-12 h-8 flex items-center justify-center hover:bg-white/10 transition-colors">
                    <i data-lucide="square" class="w-3 h-3 text-white"></i>
                </button>
                <button class="w-12 h-8 flex items-center justify-center hover:bg-red-500 transition-colors">
                    <i data-lucide="x" class="w-4 h-4 text-white"></i>
                </button>
            </div>
        </div>

        <div class="flex items-start gap-4 mt-8 relative z-10">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-600 to-blue-800 rounded-lg shadow-lg flex items-center justify-center border-t border-white/20">
                <div class="relative">
                    <div class="w-8 h-10 bg-white rounded-sm shadow-sm"></div>
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-2 bg-yellow-400 shadow-md"></div>
                    <div class="absolute top-2 left-1/2 -translate-x-1/2 w-1 h-6 bg-gray-300"></div>
                </div>
            </div>
            
            <div class="pt-1">
                <h1 class="text-3xl font-bold tracking-wide">Win解压缩</h1>
                <p class="mt-2 text-blue-100 text-sm font-medium opacity-90">轻巧快速 · 专业好用无广告</p>
            </div>
        </div>

        <div class="absolute bottom-[-20px] right-8 text-[140px] font-black italic text-white leading-none opacity-10 select-none pointer-events-none font-sans z-0">
            9.0
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 md:p-10">
        <div class="max-w-7xl mx-auto grid grid-cols-2 lg:grid-cols-4 gap-5">

            <div class="group bg-blue-50/50 hover:bg-white rounded-xl p-6 flex flex-col items-center text-center transition-all duration-300 shadow-sm hover:shadow-card-hover border border-transparent hover:border-blue-100 relative overflow-hidden">
                <div class="w-14 h-14 mb-4 relative flex items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-br from-cyan-400 to-blue-500 opacity-20 blur-xl rounded-full group-hover:opacity-30 transition-opacity"></div>
                    <svg viewBox="0 0 24 24" class="w-12 h-12 text-blue-500 fill-blue-100" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                         <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                         <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                         <line x1="12" y1="22.08" x2="12" y2="12"></line>
                         <path d="M12 8v4" class="text-blue-600 stroke-[3px]"></path> 
                         <path d="M10 10l2 2 2-2" class="text-blue-600 stroke-[3px]"></path>
                    </svg>
                </div>
                <h3 class="text-gray-800 font-bold text-lg mb-1">添加压缩包</h3>
                <p class="text-xs text-gray-500 mb-5 leading-tight">高速智能压缩，支持Zip、7z、<br>TAR等多种格式</p>
                <button class="mt-auto rounded-full px-8 py-1.5 text-sm font-medium border border-blue-200 text-blue-600 bg-white hover:bg-blue-500 hover:text-white hover:border-blue-500 transition-all active:scale-95">立即压缩</button>
            </div>

            <div class="group bg-orange-50/50 hover:bg-white rounded-xl p-6 flex flex-col items-center text-center transition-all duration-300 shadow-sm hover:shadow-card-hover border border-transparent hover:border-orange-100">
                <div class="w-14 h-14 mb-4 relative flex items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-br from-yellow-400 to-orange-500 opacity-20 blur-xl rounded-full group-hover:opacity-30 transition-opacity"></div>
                    <svg viewBox="0 0 24 24" class="w-12 h-12 text-orange-500 fill-orange-100" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5" class="fill-orange-500"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </div>
                <h3 class="text-gray-800 font-bold text-lg mb-1">图片压缩</h3>
                <p class="text-xs text-gray-500 mb-5 leading-tight">多种方式自由压缩<br>多格式支持</p>
                <button class="mt-auto rounded-full px-8 py-1.5 text-sm font-medium border border-orange-200 text-orange-600 bg-white hover:bg-orange-500 hover:text-white hover:border-orange-500 transition-all active:scale-95">立即压缩</button>
            </div>

            <div class="group bg-red-50/50 hover:bg-white rounded-xl p-6 flex flex-col items-center text-center transition-all duration-300 shadow-sm hover:shadow-card-hover border border-transparent hover:border-red-100">
                <div class="w-14 h-14 mb-4 relative flex items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-br from-red-400 to-rose-500 opacity-20 blur-xl rounded-full group-hover:opacity-30 transition-opacity"></div>
                    <div class="relative">
                        <svg viewBox="0 0 24 24" class="w-10 h-12 text-red-500 fill-white drop-shadow-sm" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        <div class="absolute top-[18px] left-[6px] bg-red-500 text-white text-[8px] font-bold px-1 rounded-sm">PDF</div>
                    </div>
                </div>
                <h3 class="text-gray-800 font-bold text-lg mb-1">PDF压缩</h3>
                <p class="text-xs text-gray-500 mb-5 leading-tight">一键批量压缩，保证PDF文件质<br>量的同时最大化压缩体积</p>
                <button class="mt-auto rounded-full px-8 py-1.5 text-sm font-medium border border-red-200 text-red-600 bg-white hover:bg-red-500 hover:text-white hover:border-red-500 transition-all active:scale-95">立即使用</button>
            </div>

            <div class="group bg-pink-50/50 hover:bg-white rounded-xl p-6 flex flex-col items-center text-center transition-all duration-300 shadow-sm hover:shadow-card-hover border border-transparent hover:border-pink-100 relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-rose-500 text-white text-[10px] px-3 py-1 rounded-bl-lg font-bold shadow-sm z-10">
                    报考专用
                </div>
                
                <div class="w-14 h-14 mb-4 relative flex items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-br from-pink-400 to-rose-500 opacity-20 blur-xl rounded-full group-hover:opacity-30 transition-opacity"></div>
                    <div class="w-10 h-10 bg-gradient-to-b from-cyan-400 to-blue-500 rounded-full flex items-end justify-center overflow-hidden shadow-md">
                        <div class="w-6 h-6 bg-white/90 rounded-t-full mb-[-2px]"></div>
                        <div class="absolute top-2 w-3 h-3 bg-white/90 rounded-full"></div>
                    </div>
                </div>
                <h3 class="text-gray-800 font-bold text-lg mb-1">证件照压缩</h3>
                <p class="text-xs text-gray-500 mb-5 leading-tight">一键智能生成报考审核照片</p>
                <button class="mt-auto rounded-full px-8 py-1.5 text-sm font-medium border border-pink-200 text-pink-600 bg-white hover:bg-rose-500 hover:text-white hover:border-rose-500 transition-all active:scale-95">立即使用</button>
            </div>

            <div class="group bg-blue-50/50 hover:bg-white rounded-xl p-6 flex flex-col items-center text-center transition-all duration-300 shadow-sm hover:shadow-card-hover border border-transparent hover:border-blue-100">
                <div class="w-14 h-14 mb-4 relative flex items-center justify-center">
                     <div class="absolute inset-0 bg-gradient-to-br from-blue-300 to-indigo-400 opacity-20 blur-xl rounded-full group-hover:opacity-30 transition-opacity"></div>
                     <div class="relative">
                        <div class="w-10 h-10 bg-gradient-to-b from-yellow-300 to-yellow-500 rounded flex items-center justify-center shadow-md">
                            <i data-lucide="arrow-big-up" class="w-6 h-6 text-white fill-current"></i>
                        </div>
                        <div class="absolute -top-1 -right-1 w-4 h-4 bg-blue-500 rounded-full"></div>
                     </div>
                </div>
                <h3 class="text-gray-800 font-bold text-lg mb-1">压缩包解压</h3>
                <p class="text-xs text-gray-500 mb-5 leading-tight">一键智能高速解压<br>64种格式支持</p>
                <button class="mt-auto rounded-full px-8 py-1.5 text-sm font-medium border border-blue-200 text-blue-600 bg-white hover:bg-blue-500 hover:text-white hover:border-blue-500 transition-all active:scale-95">一键解压</button>
            </div>

             <div class="group bg-indigo-50/50 hover:bg-white rounded-xl p-6 flex flex-col items-center text-center transition-all duration-300 shadow-sm hover:shadow-card-hover border border-transparent hover:border-indigo-100">
                <div class="w-14 h-14 mb-4 relative flex items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-br from-indigo-400 to-purple-500 opacity-20 blur-xl rounded-full group-hover:opacity-30 transition-opacity"></div>
                    <svg viewBox="0 0 24 24" class="w-12 h-12 text-indigo-500 fill-indigo-100" stroke="currentColor" stroke-width="1.5">
                        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                        <line x1="7" y1="2" x2="7" y2="22"></line>
                        <line x1="17" y1="2" x2="17" y2="22"></line>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <line x1="2" y1="7" x2="7" y2="7"></line>
                        <line x1="2" y1="17" x2="7" y2="17"></line>
                        <line x1="17" y1="17" x2="22" y2="17"></line>
                        <line x1="17" y1="7" x2="22" y2="7"></line>
                    </svg>
                </div>
                <h3 class="text-gray-800 font-bold text-lg mb-1">视频压缩</h3>
                <p class="text-xs text-gray-500 mb-5 leading-tight">高质量无损批量压缩，多种视频<br>格式支持，省时又高效</p>
                <button class="mt-auto rounded-full px-8 py-1.5 text-sm font-medium border border-indigo-200 text-indigo-600 bg-white hover:bg-indigo-500 hover:text-white hover:border-indigo-500 transition-all active:scale-95">立即使用</button>
            </div>

            <div class="group bg-slate-50 hover:bg-white rounded-xl p-6 flex flex-col items-center text-center transition-all duration-300 shadow-sm hover:shadow-card-hover border border-transparent hover:border-slate-200">
                <div class="w-14 h-14 mb-4 relative flex items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-br from-teal-300 to-emerald-400 opacity-20 blur-xl rounded-full group-hover:opacity-30 transition-opacity"></div>
                    <div class="flex gap-[-4px]">
                        <div class="w-6 h-8 bg-blue-400 rounded-sm shadow-sm -rotate-6 z-10"></div>
                        <div class="w-6 h-8 bg-green-400 rounded-sm shadow-sm rotate-6 z-0 -ml-3 mt-1"></div>
                    </div>
                </div>
                <h3 class="text-gray-800 font-bold text-lg mb-1">文档压缩</h3>
                <p class="text-xs text-gray-500 mb-5 leading-tight">高质量压缩Word/PPT/Excel等<br>文档文件</p>
                <button class="mt-auto rounded-full px-8 py-1.5 text-sm font-medium border border-slate-300 text-slate-600 bg-white hover:bg-slate-500 hover:text-white hover:border-slate-500 transition-all active:scale-95">立即压缩</button>
            </div>

            <div class="group bg-orange-50/50 hover:bg-white rounded-xl p-6 flex flex-col items-center text-center transition-all duration-300 shadow-sm hover:shadow-card-hover border border-transparent hover:border-orange-100">
                <div class="w-14 h-14 mb-4 relative flex items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-br from-yellow-300 to-orange-400 opacity-20 blur-xl rounded-full group-hover:opacity-30 transition-opacity"></div>
                    <svg viewBox="0 0 24 24" class="w-12 h-12 text-yellow-500 fill-yellow-100" stroke="currentColor" stroke-width="1.5">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <h3 class="text-gray-800 font-bold text-lg mb-1">文件管理</h3>
                <p class="text-xs text-gray-500 mb-5 leading-tight">高效管理和预览文件<br>压缩解压更方便</p>
                <button class="mt-auto rounded-full px-8 py-1.5 text-sm font-medium border border-orange-200 text-orange-600 bg-white hover:bg-orange-500 hover:text-white hover:border-orange-500 transition-all active:scale-95">开始管理</button>
            </div>

        </div>
    </main>

    <script>
        // Init Lucide Icons
        lucide.createIcons();
    </script>
</body>
</html>
