<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win解压缩 9.0 - UI Implementation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#3B82F6',
                            600: '#2563EB',
                        }
                    },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02)',
                        'card-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025)',
                    }
                }
            }
        }
    </script>
    <style>
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* 强制文本抗锯齿 */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* 特殊文字效果 */
        .watermark-text {
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="h-screen w-screen bg-white overflow-hidden flex flex-col select-none text-slate-800">

    <header class="h-24 bg-gradient-to-r from-[#2B7BE8] to-[#5FA5FA] flex items-center justify-between px-6 relative shrink-0 z-10 shadow-sm">
        
        <div class="absolute right-32 bottom-[-20px] pointer-events-none select-none overflow-hidden h-full flex items-end">
            <span class="text-[140px] font-black italic text-white opacity-10 leading-none tracking-tighter mix-blend-overlay">9.0</span>
        </div>

        <div class="flex items-center gap-4 z-10">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-lg shadow-lg flex items-center justify-center border border-white/20 relative overflow-hidden">
                <div class="absolute inset-x-0 top-0 h-4 bg-white/20"></div>
                <div class="h-8 w-1.5 bg-yellow-400 rounded-sm shadow-sm relative z-10">
                    <div class="absolute top-1 left-1/2 -translate-x-1/2 w-0.5 h-6 bg-yellow-600/50"></div>
                </div>
            </div>
            
            <div class="text-white">
                <h1 class="text-2xl font-bold tracking-tight">Win解压缩</h1>
                <p class="text-xs text-blue-100 opacity-90 mt-0.5 font-medium tracking-wide">轻巧快速 · 专业好用无广告</p>
            </div>
        </div>

        <div class="flex items-center h-full z-20">
            <div class="flex items-center gap-4 mr-8">
                <div class="flex items-center gap-2 cursor-pointer hover:bg-white/10 px-3 py-1.5 rounded-full transition-colors group">
                    <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-400">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </div>
                    <span class="text-sm text-white font-medium">未登录</span>
                </div>
                
                <button class="flex items-center gap-1.5 bg-gradient-to-r from-amber-300 to-amber-500 hover:to-amber-400 text-amber-900 px-4 py-1.5 rounded-full text-xs font-bold shadow-lg shadow-amber-500/20 transition-all hover:scale-105 active:scale-95">
                    <i data-lucide="crown" class="w-3.5 h-3.5 fill-current"></i>
                    成为会员
                </button>

                <div class="w-px h-4 bg-white/30 mx-2"></div>
                
                <button class="text-white hover:text-white/80 transition-colors flex items-center gap-1 text-sm font-medium">
                    <i data-lucide="headphones" class="w-4 h-4"></i>
                    客服
                </button>
                
                <button class="text-white hover:bg-white/10 p-2 rounded transition-colors ml-1">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="absolute top-0 right-0 flex">
                <button class="h-8 w-12 flex items-center justify-center text-white hover:bg-white/10 transition-colors">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                </button>
                <button class="h-8 w-12 flex items-center justify-center text-white hover:bg-white/10 transition-colors">
                    <div class="w-3 h-3 border border-current rounded-[1px]"></div>
                </button>
                <button class="h-8 w-12 flex items-center justify-center text-white hover:bg-red-500 transition-colors group">
                    <i data-lucide="x" class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-white p-8 sm:p-12">
        <div class="max-w-[1400px] mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

            <div class="group relative bg-blue-50 rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:shadow-card-hover hover:-translate-y-1 cursor-pointer border border-blue-100/50">
                <div class="w-16 h-16 mb-5 flex items-center justify-center">
                    <div class="relative w-14 h-14 bg-gradient-to-b from-blue-400 to-blue-600 rounded-lg shadow-blue-200 shadow-xl flex items-center justify-center transform group-hover:scale-110 transition-transform duration-300">
                        <i data-lucide="arrow-down-to-line" class="text-white w-8 h-8"></i>
                    </div>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2">添加压缩包</h3>
                <p class="text-xs text-slate-500 leading-relaxed mb-6 h-8 line-clamp-2">高速智能压缩，支持Zip、7z、TAR等多种格式</p>
                <button class="mt-auto px-8 py-1.5 rounded-full border border-blue-300 text-blue-600 text-sm font-medium bg-white hover:bg-blue-500 hover:text-white hover:border-blue-500 transition-all active:scale-95">
                    立即压缩
                </button>
            </div>

            <div class="group relative bg-orange-50 rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:shadow-card-hover hover:-translate-y-1 cursor-pointer border border-orange-100/50">
                <div class="w-16 h-16 mb-5 flex items-center justify-center">
                    <div class="relative w-14 h-14 bg-gradient-to-br from-orange-300 to-orange-500 rounded-lg shadow-orange-200 shadow-xl flex items-center justify-center transform group-hover:scale-110 transition-transform duration-300">
                        <i data-lucide="image" class="text-white w-8 h-8"></i>
                    </div>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2">图片压缩</h3>
                <p class="text-xs text-slate-500 leading-relaxed mb-6 h-8 line-clamp-2">多种方式自由压缩<br>多格式支持</p>
                <button class="mt-auto px-8 py-1.5 rounded-full border border-orange-300 text-orange-600 text-sm font-medium bg-white hover:bg-orange-500 hover:text-white hover:border-orange-500 transition-all active:scale-95">
                    立即压缩
                </button>
            </div>

            <div class="group relative bg-red-50 rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:shadow-card-hover hover:-translate-y-1 cursor-pointer border border-red-100/50">
                <div class="w-16 h-16 mb-5 flex items-center justify-center">
                    <div class="relative w-12 h-14 bg-gradient-to-br from-red-400 to-red-600 rounded-sm shadow-red-200 shadow-xl flex items-center justify-center transform group-hover:scale-110 transition-transform duration-300">
                        <span class="text-white font-bold text-[10px] absolute top-2 left-2">PDF</span>
                        <i data-lucide="file-text" class="text-white/80 w-6 h-6 mt-2"></i>
                    </div>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2">PDF压缩</h3>
                <p class="text-xs text-slate-500 leading-relaxed mb-6 h-8 line-clamp-2">一键批量压缩，保证PDF文件质量的同时最大化压缩体积</p>
                <button class="mt-auto px-8 py-1.5 rounded-full border border-red-300 text-red-600 text-sm font-medium bg-white hover:bg-red-500 hover:text-white hover:border-red-500 transition-all active:scale-95">
                    立即使用
                </button>
            </div>

            <div class="group relative bg-rose-50 rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:shadow-card-hover hover:-translate-y-1 cursor-pointer border border-rose-100/50">
                <div class="absolute top-0 right-0 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-bl-lg rounded-tr-lg z-10">
                    报考专用
                </div>
                
                <div class="w-16 h-16 mb-5 flex items-center justify-center">
                    <div class="relative w-14 h-14 bg-gradient-to-br from-blue-300 to-cyan-400 rounded-full shadow-cyan-200 shadow-xl flex items-center justify-center transform group-hover:scale-110 transition-transform duration-300">
                        <i data-lucide="user-square" class="text-white w-7 h-7"></i>
                    </div>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2">证件照压缩</h3>
                <p class="text-xs text-slate-500 leading-relaxed mb-6 h-8 line-clamp-2">一键智能生成报考审核照片</p>
                <button class="mt-auto px-8 py-1.5 rounded-full border border-blue-300 text-blue-600 text-sm font-medium bg-white hover:bg-blue-500 hover:text-white hover:border-blue-500 transition-all active:scale-95">
                    立即使用
                </button>
            </div>

            <div class="group relative bg-sky-50 rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:shadow-card-hover hover:-translate-y-1 cursor-pointer border border-sky-100/50">
                <div class="w-16 h-16 mb-5 flex items-center justify-center">
                    <div class="relative w-14 h-14 bg-gradient-to-br from-sky-300 to-sky-500 rounded-lg shadow-sky-200 shadow-xl flex items-center justify-center transform group-hover:scale-110 transition-transform duration-300">
                        <i data-lucide="folder-open" class="text-white w-8 h-8"></i>
                        <i data-lucide="arrow-up" class="absolute text-white w-4 h-4 -top-2 bg-yellow-400 rounded-full p-0.5 border-2 border-white"></i>
                    </div>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2">压缩包解压</h3>
                <p class="text-xs text-slate-500 leading-relaxed mb-6 h-8 line-clamp-2">一键智能高速解压<br>64种格式支持</p>
                <button class="mt-auto px-8 py-1.5 rounded-full border border-sky-300 text-sky-600 text-sm font-medium bg-white hover:bg-sky-500 hover:text-white hover:border-sky-500 transition-all active:scale-95">
                    一键解压
                </button>
            </div>

            <div class="group relative bg-indigo-50 rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:shadow-card-hover hover:-translate-y-1 cursor-pointer border border-indigo-100/50">
                <div class="w-16 h-16 mb-5 flex items-center justify-center">
                    <div class="relative w-14 h-12 bg-gradient-to-br from-indigo-400 to-indigo-600 rounded-lg shadow-indigo-200 shadow-xl flex items-center justify-center transform group-hover:scale-110 transition-transform duration-300">
                         <i data-lucide="clapperboard" class="text-white w-7 h-7"></i>
                    </div>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2">视频压缩</h3>
                <p class="text-xs text-slate-500 leading-relaxed mb-6 h-8 line-clamp-2">高质量无损批量压缩，多种视频格式支持，省时又高效</p>
                <button class="mt-auto px-8 py-1.5 rounded-full border border-indigo-300 text-indigo-600 text-sm font-medium bg-white hover:bg-indigo-500 hover:text-white hover:border-indigo-500 transition-all active:scale-95">
                    立即使用
                </button>
            </div>

             <div class="group relative bg-yellow-50 rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:shadow-card-hover hover:-translate-y-1 cursor-pointer border border-yellow-100/50">
                <div class="w-16 h-16 mb-5 flex items-center justify-center">
                    <div class="flex gap-[-4px]">
                         <div class="w-10 h-12 bg-blue-500 rounded-sm shadow-md -rotate-12 z-0"></div>
                         <div class="w-10 h-12 bg-orange-400 rounded-sm shadow-md z-10 -ml-6"></div>
                         <div class="w-10 h-12 bg-green-500 rounded-sm shadow-md rotate-12 z-20 -ml-6 flex items-center justify-center text-white text-xs font-bold">W</div>
                    </div>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2">文档压缩</h3>
                <p class="text-xs text-slate-500 leading-relaxed mb-6 h-8 line-clamp-2">高质量压缩Word/PPT/Excel等文档文件</p>
                <button class="mt-auto px-8 py-1.5 rounded-full border border-yellow-400 text-yellow-700 text-sm font-medium bg-white hover:bg-yellow-500 hover:text-white hover:border-yellow-500 transition-all active:scale-95">
                    立即压缩
                </button>
            </div>

            <div class="group relative bg-amber-50 rounded-xl p-8 flex flex-col items-center text-center transition-all duration-300 hover:shadow-card-hover hover:-translate-y-1 cursor-pointer border border-amber-100/50">
                <div class="w-16 h-16 mb-5 flex items-center justify-center">
                    <div class="relative w-16 h-12 bg-gradient-to-br from-amber-300 to-amber-500 rounded-lg shadow-amber-200 shadow-xl flex items-center justify-center transform group-hover:scale-110 transition-transform duration-300">
                        <i data-lucide="folder" class="text-white w-7 h-7 fill-white/20"></i>
                    </div>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-2">文件管理</h3>
                <p class="text-xs text-slate-500 leading-relaxed mb-6 h-8 line-clamp-2">高效管理和预览文件<br>压缩解压更方便</p>
                <button class="mt-auto px-8 py-1.5 rounded-full border border-amber-300 text-amber-600 text-sm font-medium bg-white hover:bg-amber-500 hover:text-white hover:border-amber-500 transition-all active:scale-95">
                    开始管理
                </button>
            </div>

        </div>
    </main>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();
    </script>
</body>
</html>
